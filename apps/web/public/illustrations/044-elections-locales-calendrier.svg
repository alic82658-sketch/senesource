<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Urne et calendrier électoral sans date</title>
  <desc id="desc">Illustration éditoriale d'une urne transparente devant un calendrier dont plusieurs cases restent vides.</desc>
  <defs>
