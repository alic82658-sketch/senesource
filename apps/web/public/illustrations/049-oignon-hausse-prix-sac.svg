<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sacs d'oignons et flambée du prix</title>
  <desc id="desc">Illustration éditoriale : une pile de sacs d'oignons en filet devant un graphique dont la barre récente est presque deux fois plus haute.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f1e8"/>
      <stop offset="1" stop-color="#e9e1d2"/>
    </linearGradient>
    <linearGradient id="onion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d99b52"/>
      <stop offset="1" stop-color="#b5702a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#15293c" flood-opacity=".17"/>
    </filter>
    <pattern id="papergrain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1.2" fill="#10283d" opacity=".035"/>
      <circle cx="37" cy="31" r=".9" fill="#10283d" opacity=".03"/>
    </pattern>
    <clipPath id="sackclip">
      <path d="M52 96 C16 158 26 250 74 292 C150 326 236 326 312 292 C360 250 370 158 334 96 C300 78 258 72 193 72 C128 72 86 78 52 96 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#papergrain)"/>
  <circle cx="1330" cy="140" r="250" fill="#a93a35" opacity=".06"/>
  <circle cx="150" cy="800" r="300" fill="#173b59" opacity=".05"/>

  <!-- Plank / étal -->
  <g filter="url(#shadow)">
    <rect x="150" y="690" width="660" height="46" rx="8" fill="#7a4f28" stroke="#173b59" stroke-width="10"/>
    <rect x="196" y="736" width="34" height="96" fill="#7a4f28" stroke="#173b59" stroke-width="10"/>
    <rect x="730" y="736" width="34" height="96" fill="#7a4f28" stroke="#173b59" stroke-width="10"/>
  </g>

  <!-- Trois sacs d'oignons empilés -->
  <!-- sac : neck + corps rempli d'oignons + filet rouge + bandeau vert -->
  <g filter="url(#shadow)">
    <!-- sac bas gauche -->
    <g transform="translate(150 372) scale(0.92)">
      <g fill="#173b59"><path d="M150 78 l40 -34 h60 l40 34 z"/></g>
      <rect x="182" y="30" width="96" height="24" rx="10" fill="#2f7d4f" stroke="#173b59" stroke-width="8"/>
      <path d="M52 96 C16 158 26 250 74 292 C150 326 236 326 312 292 C360 250 370 158 334 96 C300 78 258 72 193 72 C128 72 86 78 52 96 Z" fill="url(#onion)" stroke="#173b59" stroke-width="11"/>
      <g clip-path="url(#sackclip)">
        <g fill="#c98a3f" stroke="#8a521c" stroke-width="4">
          <circle cx="110" cy="150" r="30"/><circle cx="185" cy="135" r="33"/><circle cx="262" cy="152" r="30"/>
          <circle cx="90" cy="220" r="31"/><circle cx="165" cy="212" r="34"/><circle cx="245" cy="220" r="31"/><circle cx="312" cy="210" r="27"/>
          <circle cx="130" cy="278" r="30"/><circle cx="212" cy="282" r="32"/><circle cx="288" cy="276" r="28"/>
        </g>
        <g stroke="#a93a35" stroke-width="6" opacity=".5">
          <path d="M-20 60 L360 260 M-20 130 L360 330 M-20 200 L360 400 M40 -20 L300 360 M120 -20 L380 360 M-60 60 L200 420"/>
        </g>
      </g>
      <rect x="40" y="196" width="306" height="40" rx="10" fill="#2f7d4f" stroke="#173b59" stroke-width="8"/>
      <rect x="120" y="204" width="146" height="24" rx="6" fill="#fffdf8"/>
    </g>

    <!-- sac bas droite -->
    <g transform="translate(452 372) scale(0.92)">
      <g fill="#173b59"><path d="M150 78 l40 -34 h60 l40 34 z"/></g>
      <rect x="182" y="30" width="96" height="24" rx="10" fill="#2f7d4f" stroke="#173b59" stroke-width="8"/>
      <path d="M52 96 C16 158 26 250 74 292 C150 326 236 326 312 292 C360 250 370 158 334 96 C300 78 258 72 193 72 C128 72 86 78 52 96 Z" fill="url(#onion)" stroke="#173b59" stroke-width="11"/>
      <g clip-path="url(#sackclip)">
        <g fill="#c98a3f" stroke="#8a521c" stroke-width="4">
          <circle cx="110" cy="150" r="30"/><circle cx="185" cy="135" r="33"/><circle cx="262" cy="152" r="30"/>
          <circle cx="90" cy="220" r="31"/><circle cx="165" cy="212" r="34"/><circle cx="245" cy="220" r="31"/><circle cx="312" cy="210" r="27"/>
          <circle cx="130" cy="278" r="30"/><circle cx="212" cy="282" r="32"/><circle cx="288" cy="276" r="28"/>
        </g>
        <g stroke="#a93a35" stroke-width="6" opacity=".5">
          <path d="M-20 60 L360 260 M-20 130 L360 330 M-20 200 L360 400 M40 -20 L300 360 M120 -20 L380 360 M-60 60 L200 420"/>
        </g>
      </g>
      <rect x="40" y="196" width="306" height="40" rx="10" fill="#2f7d4f" stroke="#173b59" stroke-width="8"/>
      <rect x="120" y="204" width="146" height="24" rx="6" fill="#fffdf8"/>
    </g>

    <!-- sac sommet -->
    <g transform="translate(300 168) scale(0.92)">
      <g fill="#173b59"><path d="M150 78 l40 -34 h60 l40 34 z"/></g>
      <rect x="182" y="30" width="96" height="24" rx="10" fill="#2f7d4f" stroke="#173b59" stroke-width="8"/>
      <path d="M52 96 C16 158 26 250 74 292 C150 326 236 326 312 292 C360 250 370 158 334 96 C300 78 258 72 193 72 C128 72 86 78 52 96 Z" fill="url(#onion)" stroke="#173b59" stroke-width="11"/>
      <g clip-path="url(#sackclip)">
        <g fill="#c98a3f" stroke="#8a521c" stroke-width="4">
          <circle cx="110" cy="150" r="30"/><circle cx="185" cy="135" r="33"/><circle cx="262" cy="152" r="30"/>
          <circle cx="90" cy="220" r="31"/><circle cx="165" cy="212" r="34"/><circle cx="245" cy="220" r="31"/><circle cx="312" cy="210" r="27"/>
          <circle cx="130" cy="278" r="30"/><circle cx="212" cy="282" r="32"/><circle cx="288" cy="276" r="28"/>
        </g>
        <g stroke="#a93a35" stroke-width="6" opacity=".5">
          <path d="M-20 60 L360 260 M-20 130 L360 330 M-20 200 L360 400 M40 -20 L300 360 M120 -20 L380 360 M-60 60 L200 420"/>
        </g>
      </g>
      <rect x="40" y="196" width="306" height="40" rx="10" fill="#2f7d4f" stroke="#173b59" stroke-width="8"/>
      <rect x="120" y="204" width="146" height="24" rx="6" fill="#fffdf8"/>
    </g>
  </g>

  <!-- Graphique : la barre récente presque deux fois plus haute -->
  <g filter="url(#shadow)" transform="translate(946 300)">
    <line x1="0" y1="436" x2="470" y2="436" stroke="#173b59" stroke-width="12" stroke-linecap="round"/>
    <rect x="70" y="286" width="150" height="150" fill="#efe6d4" stroke="#173b59" stroke-width="11"/>
    <rect x="290" y="152" width="150" height="284" fill="#a93a35" stroke="#173b59" stroke-width="11"/>
    <path d="M120 250 C210 150 250 130 360 96" fill="none" stroke="#a93a35" stroke-width="12" stroke-linecap="round"/>
    <path d="M330 92 l40 -6 l-4 42 z" fill="#a93a35" stroke="#173b59" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <path d="M170 800c210 40 430 40 660 0" fill="none" stroke="#a93a35" stroke-width="8" stroke-linecap="round" opacity=".5"/>
</svg>
